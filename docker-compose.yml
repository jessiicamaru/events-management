services:
  tunnel:
    image: ngrok/ngrok:latest
    container_name: habit_tracker_tunnel
    restart: always
    environment:
      # Values come from .env (gitignored). See .env.example.
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env - see .env.example}
    command:
      - http
      - host.docker.internal:5000
      - --domain=${NGROK_DOMAIN:?set NGROK_DOMAIN in .env - see .env.example}
    extra_hosts:
      - "host.docker.internal:host-gateway"
